<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamPulse - Kampüs Etkinlik & Kulüp Senkronizasyonu</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151f32', 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
                        indigo: { 500: '#6366f1', 600: '#4f46e5' },
                        cyan: { 400: '#38bdf8', 500: '#06b6d4' }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        };
    </script>

    <!-- Supabase JS Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- FontAwesome Icon Set -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Genel Gövde Stilleri */
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
            position: relative;
            overflow-x: hidden;
            background-color: #0b0f19 !important;
            color: #f1f5f9;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbar Gizleme Sınıfları */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* GPU Hızlandırmalı Arka Plan Işık Efektleri (Performans odaklı) */
        body::before, body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(85px);
            pointer-events: none;
            z-index: -1;
            will-change: transform;
            opacity: 0.4;
        }

        body::before {
            top: -150px;
            left: -100px;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, rgba(6, 182, 212, 0) 70%);
            animation: floatOrbOne 14s ease-in-out infinite alternate;
        }

        body::after {
            bottom: -150px;
            right: -100px;
            width: 580px;
            height: 580px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.4) 0%, rgba(129, 140, 248, 0) 70%);
            animation: floatOrbTwo 18s ease-in-out infinite alternate;
        }

        @keyframes floatOrbOne {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(80px, 60px, 0) scale(1.15); }
            100% { transform: translate3d(-40px, 120px, 0) scale(0.95); }
        }

        @keyframes floatOrbTwo {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(-90px, -70px, 0) scale(1.2); }
            100% { transform: translate3d(50px, -110px, 0) scale(0.9); }
        }

        /* Özel Scrollbar Tasarımı */
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.8); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #6366f1, #06b6d4);
            border-radius: 99px;
            border: 2px solid rgba(15, 23, 42, 0.9);
        }

        /* Header Glassmorphism Efekti */
        header {
            background: rgba(15, 23, 42, 0.75) !important;
            backdrop-filter: blur(16px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        .logo-box {
            animation: logoPulse 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7), 0 0 15px rgba(6, 182, 212, 0.3); }
            50% { box-shadow: 0 0 0 12px rgba(99, 102, 241, 0), 0 0 22px rgba(6, 182, 212, 0.6); }
        }

        /* Form Elemanları Etkileşim Tasarımı */
        input:focus, select:focus, textarea:focus {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25), inset 0 0 10px rgba(99, 102, 241, 0.15) !important;
            outline: none;
        }

        /* Kart Parlama ve Hover Animasyonu */
        .event-card {
            position: relative;
            overflow: hidden;
            background: rgba(30, 41, 59, 0.65) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.07) !important;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .event-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transform: skewX(-25deg);
            transition: left 0.75s ease;
            pointer-events: none;
        }

        .event-card:hover::after { left: 150%; }
        .event-card:hover {
            transform: translate3d(0, -4px, 0);
            border-color: rgba(56, 189, 248, 0.45) !important;
            box-shadow: 0 16px 35px -10px rgba(15, 23, 42, 0.8), 0 0 20px rgba(99, 102, 241, 0.2);
        }

        /* Çakışma Uyarısı Glow Efekti */
        .conflict-card {
            border-color: rgba(239, 68, 68, 0.8) !important;
            animation: conflictGlow 1.8s ease-in-out infinite alternate;
        }

        @keyframes conflictGlow {
            0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
            100% { box-shadow: 0 0 22px rgba(239, 68, 68, 0.55); }
        }

        /* Modal Giriş Yaylanma (Spring) Efekti */
        .modal-content {
            background: rgba(30, 41, 59, 0.94) !important;
            backdrop-filter: blur(24px) saturate(200%) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            animation: modalSpring 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes modalSpring {
            0% { opacity: 0; transform: translate3d(0, 25px, 0) scale(0.92); }
            100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }

        /* Yükleniyor Spinner Animasyonu */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid #38bdf8;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-white">

    <!-- ==========================================
         1. GİRİŞ VE KAYIT EKRANI (Auth Screen)
         ========================================== -->
    <div id="auth-screen" class="flex flex-col items-center justify-center min-h-screen p-4 z-50 absolute inset-0 bg-[#0b0f19]">
        <!-- Logo Alanı -->
        <div class="mb-8 text-center">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-tr from-indigo-500 to-cyan-500 shadow-[0_0_40px_rgba(56,189,248,0.4)] mb-4 mx-auto logo-box">
                <i class="fa-solid fa-wave-square text-white text-4xl"></i>
            </div>
            <h1 class="text-4xl font-black tracking-tight bg-gradient-to-r from-white via-slate-100 to-cyan-400 bg-clip-text text-transparent">
                CamPulse
            </h1>
            <p class="text-slate-400 font-medium mt-2">Kampüs Etkinlik Ağına Katıl</p>
        </div>
        
        <!-- Form Alanı -->
        <div class="w-full max-w-sm bg-slate-800/80 backdrop-blur-xl p-8 rounded-3xl border border-slate-700/50 shadow-2xl">
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5 ml-1"><i class="fa-solid fa-envelope mr-1"></i> E-Posta Adresi</label>
                    <input type="email" id="email-input" placeholder="ogrenci@gaziantep.edu.tr" 
                           class="w-full p-3.5 rounded-xl bg-slate-900/50 text-white border border-slate-700 focus:border-cyan-400 transition-all text-sm">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5 ml-1"><i class="fa-solid fa-lock mr-1"></i> Şifre</label>
                    <input type="password" id="password-input" placeholder="••••••••" 
                           class="w-full p-3.5 rounded-xl bg-slate-900/50 text-white border border-slate-700 focus:border-cyan-400 transition-all text-sm">
                </div>
                
                <!-- Durum Mesajı Kutusu -->
                <div id="auth-message-box" class="hidden p-3 rounded-lg text-sm font-semibold flex items-center gap-2">
                    <i id="auth-message-icon" class="fa-solid"></i>
                    <span id="auth-message-text"></span>
                </div>

                <div class="pt-2 space-y-3">
                    <button onclick="login()" id="login-btn" class="relative w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-cyan-500/25 transition-all overflow-hidden flex justify-center items-center h-12">
                        <span id="login-text">Sisteme Giriş Yap</span>
                        <div id="login-loader" class="loader hidden"></div>
                    </button>
                    
                    <button onclick="register()" id="register-btn" class="relative w-full bg-slate-700/50 hover:bg-slate-700 border border-slate-600 text-white font-bold py-3.5 rounded-xl transition-all flex justify-center items-center h-12">
                        <span id="register-text">Yeni Hesap Oluştur</span>
                        <div id="register-loader" class="loader hidden"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
         2. ANA UYGULAMA EKRANI (Main Screen)
         ========================================== -->
    <div id="main-screen" style="display: none;" class="w-full h-full flex flex-col flex-1">
        
        <!-- HEADER / UYGULAMA ÜST BAR-I -->
        <header class="sticky top-0 z-30 px-4 py-3">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <!-- Logo (Küçük) -->
                <div class="flex items-center space-x-3">
                    <div class="logo-box w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-500 flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-wave-square text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black tracking-tight bg-gradient-to-r from-white via-slate-100 to-cyan-400 bg-clip-text text-transparent">
                            Cam<span class="text-cyan-400">Pulse</span>
                        </h1>
                        <p id="user-email-display" class="text-[10px] text-slate-400 font-medium">Yükleniyor...</p>
                    </div>
                </div>

                <!-- Çıkış Butonu -->
                <div class="flex items-center bg-slate-800/90 p-1.5 rounded-xl border border-slate-700/80">
                    <button onclick="logout()" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-red-400 hover:text-white hover:bg-red-500/80 flex items-center gap-1.5">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> <span class="hidden sm:inline">Çıkış</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- ANA İÇERİK BÖLÜMÜ -->
        <main class="max-w-4xl mx-auto w-full flex-1 px-4 py-6 space-y-6">

            <!-- CANLI ARAMA BARI -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="renderEvents()" placeholder="Etkinlik adı, kulüp veya açıklama içinde ara..." 
                    class="w-full bg-slate-800/80 border border-slate-700/80 rounded-2xl pl-11 pr-4 py-3 text-sm focus:outline-none transition-all placeholder:text-slate-500 text-slate-100">
            </div>

            <!-- HAFTALIK GÜN ŞERİDİ -->
            <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-1" id="daysList">
                <!-- JS ile Doldurulacak -->
            </div>

            <!-- KATEGORİ FİLTRELERİ -->
            <div class="flex space-x-2 overflow-x-auto no-scrollbar" id="categoriesList">
                <!-- JS ile Doldurulacak -->
            </div>

            <!-- YÖNETİCİ BANNERI VE EKLEME FORMU (Sadece Admin Görebilir) -->
            <div id="admin-panel" style="display: none;" class="bg-indigo-950/40 border border-indigo-500/30 rounded-3xl p-5 shadow-xl backdrop-blur-md">
                <div class="flex items-center justify-between mb-4 pb-4 border-b border-indigo-500/20">
                    <div class="flex items-center gap-3">
                        <div class="p-2.5 bg-indigo-600/30 text-indigo-400 rounded-xl">
                            <i class="fa-solid fa-shield-halved text-xl"></i>
                        </div>
                        <div>
                            <h3 class="text-sm font-bold text-indigo-300">Yönetici Yetkisi Aktif</h3>
                            <p class="text-xs text-indigo-400/60">Veritabanına tam erişiminiz var.</p>
                        </div>
                    </div>
                    <button onclick="toggleAdminForm()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-600/30 whitespace-nowrap">
                        <i class="fa-solid fa-plus mr-1"></i> Yeni Etkinlik
                    </button>
                </div>
                
                <!-- Hızlı Ekleme Formu (Başlangıçta Gizli) -->
                <form id="quickAddForm" onsubmit="handleAddEvent(event)" style="display: none;" class="space-y-3 pt-2">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <input type="text" id="addTitle" required placeholder="Etkinlik Adı (Zorunlu)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <input type="text" id="addClub" required placeholder="Kulüp Adı" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <input type="text" id="addLocation" required placeholder="Konum" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <select id="addDayIndex" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                            <option value="1">Pazartesi</option><option value="2">Salı</option><option value="3">Çarşamba</option><option value="4">Perşembe</option><option value="5">Cuma</option><option value="6">Cumartesi</option><option value="7">Pazar</option>
                        </select>
                        <input type="time" id="addStartTime" required value="12:00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 text-center">
                        <input type="time" id="addEndTime" required value="14:00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 text-center">
                    </div>
                    <textarea id="addDesc" rows="2" placeholder="Etkinlik açıklaması..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
                    
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="toggleAdminForm()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white bg-slate-800 border border-slate-700">İptal</button>
                        <button type="submit" id="submit-event-btn" class="px-6 py-2 rounded-xl text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 shadow-lg flex items-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Veritabanına Yaz
                        </button>
                    </div>
                </form>
            </div>

            <!-- ETKİNLİK LİSTESİ KONTEYNERİ (Supabase'den Gelecek Veriler) -->
            <div id="loading-indicator" class="flex flex-col items-center justify-center py-12 space-y-4">
                <div class="loader !w-10 !h-10 border-[4px]"></div>
                <p class="text-slate-400 font-medium animate-pulse">Etkinlikler Senkronize Ediliyor...</p>
            </div>

            <div class="space-y-4" id="eventsContainer">
                <!-- JS ile Doldurulacak -->
            </div>
        </main>
    </div>

    <!-- ==========================================
         3. TOAST BİLDİRİM SİSTEMİ
         ========================================== -->
    <div id="toast" class="fixed bottom-6 right-6 bg-emerald-600 text-white font-semibold text-sm px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-24 opacity-0 pointer-events-none z-50 flex items-center space-x-2 max-w-xs">
        <i id="toastIcon" class="fa-solid fa-circle-check text-base"></i>
        <span id="toastMsg" class="leading-tight">İşlem başarılı!</span>
    </div>

    <!-- Mantık Dosyasını Çağır -->
    <script src="app.js"></script>
</body>
</html>
